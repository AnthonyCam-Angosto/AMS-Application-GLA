<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <link th:href="@{/styles/style.css}"  href="../static/styles/style.css" rel="stylesheet">
    <link th:href="@{/styles/login_insciption.css}"  href="../static/styles/login_insciption.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Créer un compte</h1>
        <form id="signupForm" th:action="@{/inscription}" th:object="${user}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:field="*{email}" required />
            <span class="error" id="emailError" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erreur email</span>
            </div>


            <div class="form-group">
            <label for="username">Identifiant :</label>
            <input type="text" id="username" name="username"  th:field="*{identifiant}" required />
            <span class="error" id="usernameError" th:if="${#fields.hasErrors('identifiant')}" th:errors="*{identifiant}">Erreur identifiant</span>
            </div>

            <div class="form-group">
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" th:field="*{password}" required />
            </div>

            <button type="submit" class="btn">S’inscrire</button>
        </form>
        <p class="register-link">
        Déjà inscrit ? <a th:href="@{/login}">Connectez-vous</a>
        </p>
    </div>
</body>
</html>
