services:
  fetchapi-worker:
    build: ./FetchAPI
    image: fetchapi-worker
    container_name: fetchapi-worker
    command: celery -A src.worker.celery worker
    environment:
      POSTGRES_PASSWORD: docker
    networks:
     - ams_network
    depends_on:
      - redis
      - db
  
  fetchapi-beat:
      build: ./FetchAPI
      image: fetchapi-beat
      container_name: fetchapi-beat
      command: celery -A src.worker.celery beat
      environment:
        POSTGRES_PASSWORD: docker
      networks:
      - ams_network
      depends_on:
        - redis
        - db

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - ams_network

  db:
    build: ./db
    container_name: db
    volumes:
      - ./db/data:/var/lib/postgresql
    networks:
      - ams_network
    ports:
      - "5432:5432"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - ams_network

  ServeurWeb:
    build: 
      context: ./ServeurWeb
      dockerfile: Dockerfile
    image: serveurweb
    container_name: serveurweb
    ports:
      - "8080:8080"
    environment:
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
    networks:
      - ams_network
    depends_on:
      - db
      - mailhog
  
  
networks:
  ams_network:
    driver: bridge
