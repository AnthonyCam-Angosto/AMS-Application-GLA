services:
  fetchapi:
    build: ./FetchAPI
    image: fetchapi
    container_name: fetchapi
    networks:
     - ams_network
  
  db:
    build: ./db
    container_name: db
    #volumes:
    #  - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: info_crypto
    networks:
      - ams_network

  ServeurWeb:
    build: 
      context: ./ServeurWeb
      dockerfile: Dockerfile
    image: serveurweb
    container_name: serveurweb
    ports:
      - "8080:80"
    networks:
      - ams_network
  
networks:
  ams_network:
    driver: bridge